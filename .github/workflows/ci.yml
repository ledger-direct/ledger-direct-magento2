name: CI

# What runs depends on what changed (job "changes", .github/actions/changes): a pull request that
# touches only documentation runs the lint job and nothing else; everything else runs the whole
# suite. Tags, schedule and manual runs have no diff to classify and run everything. A newer commit
# on the same pull request cancels the run still going. Job "passed" ("CI passed") sums up the jobs
# a pull request runs; it is the check a merge requires.

on:
  push:
    # main only: feature branches are covered by their pull request
    branches: [main]
  pull_request:
  # Weekly: the same unit tests against Adobe's own repository, as a cross-check of the mirror.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Every job only reads the repository; nothing here writes to GitHub.
permissions:
  contents: read

# A newer push to the same pull request cancels its run in progress. Every other run (push to main,
# tag, manual) gets a group of its own: GitHub keeps only one pending run per group, so a shared
# group would cancel a pending main run whose changes the next run never classifies again.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request: the merge commit and both parents; push: the pushed range
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - id: changes
        uses: ./.github/actions/changes

  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: php -l on all module sources
        run: |
          set -e
          find . -path ./.github -prune -o -name '*.php' -print | while read -r file; do
            php -l "$file"
          done

  coding-standard:
    name: Coding standard (magento-coding-standard)
    needs: changes
    # Fail-safe: a failed "changes" job leaves the output empty and the job runs; without the
    # !cancelled() it would be skipped, and a skipped job counts as passed.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      # magento/magento-coding-standard is public on packagist.org, unlike Magento's
      # core framework/module packages, so this job needs no repo.magento.com
      # credentials and runs on external contributors' PRs too.
      #
      # dealerdirect/phpcodesniffer-composer-installer (which auto-registers the
      # Magento2 standard with phpcs) is a Composer plugin, and Composer 2 refuses
      # to run unknown plugins unless explicitly allowed - hence the `composer
      # config allow-plugins` step before requiring it.
      - name: Install magento-coding-standard
        run: |
          mkdir -p phpcs-tools
          composer init --no-interaction --name=ci/phpcs-tools --working-dir=phpcs-tools
          composer config --no-interaction --working-dir=phpcs-tools \
            allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --no-interaction --working-dir=phpcs-tools magento/magento-coding-standard

      - name: Run phpcs (Magento2 standard)
        run: >
          phpcs-tools/vendor/bin/phpcs --standard=Magento2 --extensions=php
          --ignore=*/tests/*,*/dev/*
          module

  unit-tests:
    name: Unit tests (Magento ${{ matrix.magento-version }})
    needs: changes
    # Fail-safe: a failed "changes" job leaves the output empty and the job runs; without the
    # !cancelled() it would be skipped, and a skipped job counts as passed.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Constraints, not exact tags: composer resolves the latest -pN patch of each release. Note
        # the 4-segment form (~2.4.7.0, not ~2.4.7): Magento's 2.4.7/2.4.8/2.4.9 are patch levels of
        # the same 2.4 minor line, and a 3-segment tilde would float straight past 2.4.8 to 2.4.9.
        magento-version: ['~2.4.7.0', '~2.4.8.0']
    # Magento Open Source comes from Mage-OS's public mirror (https://mirror.mage-os.org/). It needs
    # no credentials, so pull requests from forks run the tests too, and it is several times faster
    # than repo.magento.com. Its packages are Adobe's: a file-by-file comparison of 2.4.8-p5 from both
    # found the 51,398 code files under vendor/magento identical. unit-tests-adobe cross-checks weekly.
    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Composer cache directory
        id: cache-dir
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      # Package archives only, never vendor/: a cache hit saves the download, the install still
      # resolves from scratch against the current patch release.
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: composer-mirror-${{ matrix.magento-version }}-${{ hashFiles('module/composer.json') }}
          restore-keys: |
            composer-mirror-${{ matrix.magento-version }}-

      - name: Create Magento ${{ matrix.magento-version }} project
        run: >
          composer create-project --repository-url=https://mirror.mage-os.org/
          --no-install
          magento/project-community-edition="${{ matrix.magento-version }}" magento

      - name: Place module under app/code
        run: |
          mkdir -p magento/app/code/Hardcastle
          cp -r module magento/app/code/Hardcastle/LedgerDirect

      # A module under app/code is not composer-managed, so its own requirements never reach the
      # project's vendor/; they are required at project level - the same step a real installation
      # performs, see README.
      - name: Require the module's dependencies at project level
        working-directory: magento
        run: composer require --no-interaction --no-update "hardcastle/ledger-direct-core:^0.9" "bacon/bacon-qr-code:^2.0 || ^3.0"

      # --no-blocking: Composer 2.9+ refuses dependencies with known security advisories by
      # default. This job checks our code against Magento's classes, not the Magento build's CVEs.
      - name: composer install
        working-directory: magento
        # The mirror occasionally drops an HTTP/2 stream mid-download (curl error 18). Composer's cache
        # keeps what arrived, so a retry only fetches the rest.
        run: |
          for attempt in 1 2 3; do
            composer install --no-interaction --prefer-dist --no-progress --no-blocking && exit 0
            echo "::warning::composer install failed (attempt $attempt), retrying"
            sleep 10
          done
          exit 1

      - name: Run unit tests
        run: magento/vendor/bin/phpunit -c magento/app/code/Hardcastle/LedgerDirect/tests/phpunit.xml.dist

  # The same tests against repo.magento.com itself, weekly and on demand, so a gap or a lag in the
  # mirror shows up. Needs the MAGENTO_COMPOSER_AUTH secret:
  #   {"http-basic":{"repo.magento.com":{"username":"<public key>","password":"<private key>"}}}
  unit-tests-adobe:
    # No matrix expression in the name: a skipped job shows it unexpanded. GitHub appends the matrix.
    name: Unit tests against repo.magento.com
    needs: changes
    # Fail-safe: a failed "changes" job leaves the output empty and the job runs; without the
    # !cancelled() it would be skipped, and a skipped job counts as passed.
    if: >-
      ${{ !cancelled()
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        magento-version: ['~2.4.7.0', '~2.4.8.0']
    steps:
      - uses: actions/checkout@v4
        with:
          path: module

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Check for repo.magento.com credentials
        id: auth
        run: |
          if [ -z "${{ secrets.MAGENTO_COMPOSER_AUTH }}" ]; then
            echo "::warning::MAGENTO_COMPOSER_AUTH is not set; the repo.magento.com cross-check is skipped."
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Composer cache directory
        id: cache-dir
        if: steps.auth.outputs.has_auth == 'true'
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      # Package archives only, never vendor/: a cache hit saves the download, the install still
      # resolves from scratch against the current patch release.
      - uses: actions/cache@v4
        if: steps.auth.outputs.has_auth == 'true'
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: composer-adobe-${{ matrix.magento-version }}-${{ hashFiles('module/composer.json') }}
          restore-keys: |
            composer-adobe-${{ matrix.magento-version }}-

      - name: Create Magento ${{ matrix.magento-version }} project
        if: steps.auth.outputs.has_auth == 'true'
        env:
          COMPOSER_AUTH: ${{ secrets.MAGENTO_COMPOSER_AUTH }}
        run: >
          composer create-project --repository-url=https://repo.magento.com/
          --no-install
          magento/project-community-edition="${{ matrix.magento-version }}" magento

      - name: Place module under app/code
        if: steps.auth.outputs.has_auth == 'true'
        run: |
          mkdir -p magento/app/code/Hardcastle
          cp -r module magento/app/code/Hardcastle/LedgerDirect

      # A module under app/code is not composer-managed, so its own requirements never reach the
      # project's vendor/; they are required at project level - the same step a real installation
      # performs, see README.
      - name: Require the module's dependencies at project level
        if: steps.auth.outputs.has_auth == 'true'
        working-directory: magento
        run: composer require --no-interaction --no-update "hardcastle/ledger-direct-core:^0.9" "bacon/bacon-qr-code:^2.0 || ^3.0"

      # --no-blocking: Composer 2.9+ refuses dependencies with known security advisories by
      # default. This job checks our code against Magento's classes, not the Magento build's CVEs.
      - name: composer install
        if: steps.auth.outputs.has_auth == 'true'
        env:
          COMPOSER_AUTH: ${{ secrets.MAGENTO_COMPOSER_AUTH }}
        working-directory: magento
        # The mirror occasionally drops an HTTP/2 stream mid-download (curl error 18). Composer's cache
        # keeps what arrived, so a retry only fetches the rest.
        run: |
          for attempt in 1 2 3; do
            composer install --no-interaction --prefer-dist --no-progress --no-blocking && exit 0
            echo "::warning::composer install failed (attempt $attempt), retrying"
            sleep 10
          done
          exit 1

      - name: Run unit tests
        if: steps.auth.outputs.has_auth == 'true'
        run: magento/vendor/bin/phpunit -c magento/app/code/Hardcastle/LedgerDirect/tests/phpunit.xml.dist

  # The one check a merge into main requires. A job's own name changes with its matrix and shows
  # unexpanded when the job is skipped, so the branch rules name this job instead. Skipped on purpose
  # (a documentation-only pull request) counts as passed; failed or cancelled does not. always(), not
  # !cancelled(): a skipped job counts as passed, so this job has to run and report in every case.
  # The repo.magento.com cross-check is left out: it never runs on a pull request.
  passed:
    name: CI passed
    needs: [changes, lint, coding-standard, unit-tests]
    if: always()
    runs-on: ubuntu-latest
    # Reads this run's job list, nothing else.
    permissions:
      actions: read
    steps:
      - name: Every job passed or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100
        # needs.<job>.result can say "success" for a matrix one of whose legs was cancelled before a
        # runner took it (https://github.com/orgs/community/discussions/211624), so every finished job
        # of this run, each matrix leg on its own, is checked as well.
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
          gh api "$JOBS" > jobs.json
          jq -r '.jobs[] | select(.status == "completed") | "\(.name): \(.conclusion)"' jobs.json
          jq -e '[.jobs[] | select(.status == "completed") | .conclusion]
            | all(. == "success" or . == "skipped")' jobs.json > /dev/null
