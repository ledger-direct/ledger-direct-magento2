name: Try stack

# The try-it stack in dev/try: every pull request and every push to main builds the image from the
# checkout, starts the stack the way a visitor does and runs dev/try/smoke.sh against it (storefront,
# guest order, payment page markup contract, status endpoint PS-01 and PS-07). It installs the module
# into a fresh Magento on Linux the way a merchant does — the route that broke in 1.1.3.
#
# Publishing the image to GHCR (ghcr.io/ledger-direct/try-magento):
# - on a version tag, when the repository variable LD_PUBLISH_TRY_IMAGE is "true": tagged with the
#   version and ":latest", the image `docker compose up` pulls;
# - by hand (workflow_dispatch, "publish"): tagged ":edge" and "dev-<short sha>". With "latest" ticked
#   as well it also becomes ":latest", so the try image can follow a catalogue or base-image change
#   without a plugin release. "latest" without "publish" publishes nothing.
# A first publish creates the package private; switch it to public once in the package settings.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image to GHCR as ":edge" and "dev-<short sha>"
        type: boolean
        default: false
      latest:
        description: With "publish", also tag it ":latest", the image docker compose up pulls
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ledger-direct/try-magento

jobs:
  smoke:
    name: Build, start and smoke-test the try stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the shop image from this checkout
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/try/Dockerfile
          tags: ${{ env.IMAGE }}:ci
          load: true
          cache-from: type=gha,scope=try-magento
          cache-to: type=gha,mode=max,scope=try-magento

      - name: Start the stack
        working-directory: dev/try
        env:
          LD_TRY_IMAGE: ${{ env.IMAGE }}:ci
          # Empty unless set: the shop then takes a fresh account from the testnet faucet.
          LD_TESTNET_ACCOUNT: ${{ vars.LD_TRY_TESTNET_ACCOUNT }}
        run: |
          started=$(date +%s)
          docker compose up -d --wait --no-build
          echo "Stack up, shop installed: $(( $(date +%s) - started )) s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        # smoke.sh's own exit status decides the step, not tee's; the summary fence is closed either way.
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set +e
          dev/try/smoke.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The storefront the way a prospect sees it, in a real browser: home page, cart, guest
      # checkout with each LedgerDirect method, payment page. GitHub's runners ship Chrome.
      - name: Browser walk (XRP, RLUSD, USDC)
        working-directory: dev/try/browser
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          npm install --no-audit --no-fund
          mkdir -p screenshots
          for method in xrp_payment xrpl_rlusd_payment xrpl_usdc_payment; do
            echo "== $method"
            node visitor.mjs http://localhost:8088 screenshots "$method"
          done

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: try-stack-screenshots
          path: dev/try/browser/screenshots
          if-no-files-found: ignore

      - name: Shop log
        if: always()
        working-directory: dev/try
        run: docker compose logs --no-color --tail 200 phpfpm

  publish:
    name: Publish the try image
    needs: smoke
    if: >-
      (startsWith(github.ref, 'refs/tags/') && vars.LD_PUBLISH_TRY_IMAGE == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=dev-{{sha}},priority=300,enable=${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.latest) }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push (amd64 and arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/try/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LD_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.sha) }}
          cache-from: type=gha,scope=try-magento
