name: Try stack

# The try-it stack in dev/try: every pull request and every push to main builds the image from the
# checkout, starts the stack the way a visitor does and runs dev/try/smoke.sh against it (storefront,
# guest order, payment page markup contract, status endpoint PS-01 and PS-07). It installs the module
# into a fresh Magento on Linux the way a merchant does — the route that broke in 1.1.3.
#
# Publishing the image to GHCR (ghcr.io/ledger-direct/try-magento):
# only when the repository variable LD_PUBLISH_TRY_IMAGE is "true" (it switches publishing off as a
# whole), and then
# - on a pushed version tag: tagged with the version and ":latest", the image `docker compose up`
#   pulls;
# - by hand (workflow_dispatch, "publish", on any branch or tag): tagged ":edge" and
#   "dev-<short sha>". With "latest" ticked
#   as well it also becomes ":latest", so the try image can follow a catalogue or base-image change
#   without a plugin release. "latest" without "publish" publishes nothing.
# A first publish creates the package private; switch it to public once in the package settings.
#
# The stack is built only when something it runs may have changed (job "changes",
# .github/actions/changes): module code, Composer, dev/try, this workflow. A pull request that
# touches only documentation, tests or other workflows skips it; tags and manual runs always build.
# A newer commit on the same pull request cancels the run still going. Job "passed" ("Try passed")
# sums up the jobs a pull request runs; it is the check a merge requires.

on:
  pull_request:
  push:
    branches: [main]
    # version tags only (1.4.1): a pushed tag publishes the version and ":latest"
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image to GHCR as ":edge" and "dev-<short sha>"
        type: boolean
        default: false
      latest:
        description: With "publish", also tag it ":latest", the image docker compose up pulls
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ledger-direct/try-magento

# A newer push to the same pull request cancels its run in progress. Every other run (push to main,
# tag, manual) gets a group of its own: GitHub keeps only one pending run per group, so a shared
# group would cancel a pending main run whose changes the next run never classifies again.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pull_request: the merge commit and both parents; push: the pushed range
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - id: changes
        uses: ./.github/actions/changes

  smoke:
    name: Build, start and smoke-test the try stack
    needs: changes
    # Fail-safe: when the "changes" job did not succeed the stack is built anyway; without the
    # !cancelled() it would be skipped, and a skipped job counts as passed.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.runtime == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the shop image from this checkout
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dev/try/Dockerfile
          tags: ${{ env.IMAGE }}:ci
          load: true
          cache-from: type=gha,scope=try-magento
          cache-to: type=gha,mode=max,scope=try-magento

      - name: Start the stack
        working-directory: dev/try
        env:
          LD_TRY_IMAGE: ${{ env.IMAGE }}:ci
          # Empty unless set: the shop then takes a fresh account from the testnet faucet.
          LD_TESTNET_ACCOUNT: ${{ vars.LD_TRY_TESTNET_ACCOUNT }}
        run: |
          started=$(date +%s)
          docker compose up -d --wait --no-build
          echo "Stack up, shop installed: $(( $(date +%s) - started )) s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        # smoke.sh's own exit status decides the step, not tee's; the summary fence is closed either way.
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set +e
          dev/try/smoke.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The storefront the way a prospect sees it, in a real browser: home page, cart, guest
      # checkout with each LedgerDirect method, payment page. GitHub's runners ship Chrome.
      # XAH is walked like the other assets, on purpose: the step checks that the try shop takes XAH
      # out of the box. While the Xahau testnet or its faucet does not answer, the shop starts
      # without XAH and this step fails; rerun it once Xahau answers.
      - name: Browser walk (XRP, RLUSD, USDC, XAH)
        working-directory: dev/try/browser
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          npm install --no-audit --no-fund
          mkdir -p screenshots
          for method in xrp_payment xrpl_rlusd_payment xrpl_usdc_payment xahau_xah_payment; do
            echo "== $method"
            node visitor.mjs http://localhost:8088 screenshots "$method"
          done

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: try-stack-screenshots
          path: dev/try/browser/screenshots
          if-no-files-found: ignore

      - name: Shop log
        if: always()
        working-directory: dev/try
        run: docker compose logs --no-color --tail 200 phpfpm

  # The one check a merge into main requires (see ci.yml, job "passed"). Its name is in
  # .github/rulesets/main.json: renaming the job blocks every merge until the ruleset on GitHub is
  # changed too. Skipped on purpose (nothing
  # the stack runs changed) counts as passed; failed or cancelled does not. Publishing is left out:
  # it never runs on a pull request.
  passed:
    name: Try passed
    needs: [changes, smoke]
    if: always()
    runs-on: ubuntu-latest
    # Reads this run's job list, nothing else.
    permissions:
      actions: read
    steps:
      - name: Every job passed or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100
          # Jobs this check leaves out, by the start of their name: publishing, not in needs
          UNGATED: '["Publish the try image"]'
        # needs.<job>.result can say "success" for a matrix one of whose legs was cancelled before a
        # runner took it (https://github.com/orgs/community/discussions/211624), so every finished job
        # of this run, each matrix leg on its own, is checked as well, except the ones in UNGATED:
        # whether they are finished at this point is a matter of timing.
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
          gh api "$JOBS" > jobs.json
          jq --argjson ungated "$UNGATED" '[.jobs[] | select(.status == "completed")
            | select(.name as $n | $ungated | any(. as $p | $n | startswith($p)) | not)]' jobs.json > gated.json
          jq -r '.[] | "\(.name): \(.conclusion)"' gated.json
          jq -e 'all(.[]; .conclusion == "success" or .conclusion == "skipped")' gated.json > /dev/null

  publish:
    name: Publish the try image
    needs: smoke
    if: >-
      vars.LD_PUBLISH_TRY_IMAGE == 'true'
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'workflow_dispatch' && inputs.publish))
    # One publish at a time across all refs, so a tag push and a manual run never push ":latest"
    # concurrently. Runs wait in order instead of being cancelled: neither the running one nor a
    # pending one (queue: max keeps up to 100 pending, the default would replace the pending run).
    concurrency:
      group: try-image-publish
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # ":latest" only from the rules below, never added automatically
          flavor: latest=false
          tags: |
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}
            type=raw,value=dev-{{sha}},priority=300,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.latest) }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push (amd64 and arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dev/try/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LD_VERSION=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.sha) }}
          cache-from: type=gha,scope=try-magento
