# End-to-end run against the XRPL testnet and the Xahau testnet, on the try stack (dev/try): the shop
# a visitor gets with `docker compose up`, built from this checkout, not a development shop. The
# harness ledger-direct-e2e then drives the case catalogue PS-01…PS-11 against it, first on the XRP
# Ledger with `--try`, the same command that works locally, then on Xahau (which the harness switches
# on in the shop's configuration for its run). Real transactions on both testnets, paid from one CI
# treasury per chain; after the XRPL run the shop is back on its own receiving account, the Xahau run
# leaves this throwaway shop on the run's.
#
# Not a merge gate: the testnet and its faucet are not deterministic. It runs
# - on a pushed version tag: the `testnet` cases (all but PS-10's 35-minute wait), before the
#   release is announced; a red run reports, it does not stop the release;
# - weekly, on Monday: every case on the XRP Ledger, PS-04 and PS-10 included, and the `testnet`
#   cases on Xahau (PS-10 does not depend on the chain, its wait would only hold the XAH). It tests
#   the plugin's main branch and the harness's current main without a code change in between (a
#   testnet reset, a new base image, a harness change). The four plugin repositories run an hour
#   apart (Shopware 02:17, PrestaShop 03:17, WooCommerce 04:17, Magento 05:17 UTC), but GitHub can
#   start a scheduled run hours late, so the Xahau treasury holds enough for two runs at once;
# - by hand, with the cases to run.
# The workflow is the same in every LedgerDirect plugin repository except for the target.
#
# Secrets (repository secrets, under the same names in every plugin repository that has them):
#   LEDGERDIRECT_CI_XRPL_TREASURY_SEED / _ADDRESS    the CI payer wallet on the XRP Ledger (XRP, RLUSD, USDC), separate from the local one
#   LEDGERDIRECT_CI_XAHAU_TREASURY_SEED / _ADDRESS   the CI payer wallet on Xahau (XAH); it also opens the run's receiving account
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN              pulls count against the organisation, not the runner's IP
# The harness repository ledger-direct/ledger-direct-e2e is public; its checkout needs no token.
name: E2E (testnet)

on:
  push:
    # version tags only (1.9.0)
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  # Monday, 05:17 UTC: off the full hour, when GitHub delays or drops scheduled runs under load;
  # the other plugin repositories run in the hours next to it.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      cases:
        description: 'Case IDs, "automated" (all but PS-04 and PS-10), "testnet" (all but PS-10) or "all" (PS-10 waits 35 minutes)'
        default: 'automated'

# Nothing here writes to GitHub.
permissions:
  contents: read

# One run at a time in this repository: every run pays from the same treasury account, and two runs
# sending from it at once collide on its sequence numbers. Later runs queue instead of replacing
# each other, so a version tag's run is not dropped for a later one; GitHub keeps up to 100 waiting
# and cancels runs beyond that. The group does not reach across repositories: the other plugin
# repositories' runs are kept apart by their schedules, and the harness resubmits a payment whose
# sequence number another run took (tefPAST_SEQ).
concurrency:
  group: e2e-testnet
  cancel-in-progress: false
  queue: max

env:
  TARGET: magento
  IMAGE: ledger-direct/try-magento:e2e

jobs:
  e2e:
    name: ld-e2e against the try stack
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Secrets are not available in step conditions; their presence is, through the environment.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No token left in .git/config for the harness's npm dependencies to read.
          persist-credentials: false

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The same image the try workflow builds; its layer cache is read, not written.
      - name: Build the shop image from this checkout
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: dev/try/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=try-magento

      - name: Start the try stack
        working-directory: dev/try
        env:
          LD_TRY_IMAGE: ${{ env.IMAGE }}
        run: docker compose up -d --wait --no-build

      - name: Check out the harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ledger-direct/ledger-direct-e2e
          path: e2e
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build the harness
        working-directory: e2e
        run: npm ci && npm run build

      # The treasury above what a run needs (XRP from the faucet, stablecoins from the DEX, trust
      # lines with room), or the job fails here naming the shortfall, not mid-run with
      # tecUNFUNDED_PAYMENT. Runs return what they received, so this rarely has anything to do.
      - name: Check the treasury
        working-directory: e2e
        env:
          LEDGERDIRECT_TESTNET_XRPL_TREASURY_SEED: ${{ secrets.LEDGERDIRECT_CI_XRPL_TREASURY_SEED }}
        run: node dist/cli.js wallet ensure --xrp 50 --rlusd 10 --usdc 10

      - name: Run the case catalogue
        working-directory: e2e
        env:
          # The harness reads the testnet treasury variables; in CI they hold the dedicated CI wallet.
          LEDGERDIRECT_TESTNET_XRPL_TREASURY_SEED: ${{ secrets.LEDGERDIRECT_CI_XRPL_TREASURY_SEED }}
          LEDGERDIRECT_TESTNET_XRPL_TREASURY_ADDRESS: ${{ secrets.LEDGERDIRECT_CI_XRPL_TREASURY_ADDRESS }}
          # Spending limits, in the asset's units. A full run against a try shop spends about 5 XRP and
          # 2 RLUSD and USDC each; a run that wants more (a pricier article, a falling XRP price, a
          # loop) fails loudly instead of emptying the CI wallet. No other asset gets anything.
          LD_E2E_MAX_PAYMENT: '5'
          LD_E2E_RUN_BUDGET: XRP=15,RLUSD=5,USDC=5
          CASES: ${{ github.event_name == 'schedule' && 'all' || inputs.cases || 'testnet' }}
        run: node dist/cli.js run --target "$TARGET" --try --cases "$CASES" --report out/report.json

      # Xahau: the treasury holds XAH alone and the faucet is its only source; a run spends about 700
      # XAH on the 1-euro article and gets them back, so this rarely asks the faucet either.
      - name: Check the Xahau treasury
        id: xahau-treasury
        if: ${{ !cancelled() }}
        working-directory: e2e
        env:
          LEDGERDIRECT_TESTNET_XAHAU_TREASURY_SEED: ${{ secrets.LEDGERDIRECT_CI_XAHAU_TREASURY_SEED }}
        run: node dist/cli.js --chain XAHAU wallet ensure --xrp 800

      # The same shop, now on Xahau: `--try` knows the XRP Ledger only (it puts the stack's own XRPL
      # account back), so the stack is named by its preset values. PS-04 is skipped on Xahau, which
      # has no issued asset to pay a token order in. The XAH cap: about 110 XAH buy the 1-euro article.
      # Only after the treasury check passed: a run on an empty treasury fails on its first payment.
      - name: Run the case catalogue on Xahau
        if: ${{ !cancelled() && steps.xahau-treasury.conclusion == 'success' }}
        working-directory: e2e
        env:
          LEDGERDIRECT_TESTNET_XAHAU_TREASURY_SEED: ${{ secrets.LEDGERDIRECT_CI_XAHAU_TREASURY_SEED }}
          LEDGERDIRECT_TESTNET_XAHAU_TREASURY_ADDRESS: ${{ secrets.LEDGERDIRECT_CI_XAHAU_TREASURY_ADDRESS }}
          LD_E2E_MAGENTO_ADMIN_USER: demo
          LD_E2E_MAGENTO_ADMIN_PASSWORD: demo-ledgerdirect-1
          LD_E2E_MAX_PAYMENT: '250'
          LD_E2E_RUN_BUDGET: XAH=1500
          CASES: ${{ inputs.cases || 'testnet' }}
        run: >
          node dist/cli.js --chain XAHAU run --target "$TARGET" --base-url http://localhost:8088
          --compose-dir ../dev/try --cases "$CASES" --report out/report-xahau.json

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ld-e2e-report
          path: |
            e2e/out/report.json
            e2e/out/report-xahau.json
          if-no-files-found: ignore

      - name: Shop log
        if: failure()
        working-directory: dev/try
        run: docker compose logs --no-color --tail 200
