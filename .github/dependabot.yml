version: 2
updates:
  # The actions in the workflows, pinned to commit SHAs with the version in a comment. Dependabot
  # updates both; all action updates of a week come as one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # The base images of the try image, pinned by tag and digest in the FROM lines.
  - package-ecosystem: docker
    directory: /dev/try
    schedule:
      interval: weekly
    ignore:
      # The try image stays on PHP 8.3; a new PHP minor is a decision of its own, not an update.
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
