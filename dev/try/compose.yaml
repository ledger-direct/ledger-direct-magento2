# LedgerDirect for Magento 2 — try it in five minutes, on the XRP Ledger testnet.
#
#   docker compose up -d --wait          # first start installs the shop, about two minutes
#   open http://localhost:8088/
#   docker compose down                  # reset: the next `up` starts from scratch
#
# Settings (environment or a .env file next to this one):
#   LD_TRY_PORT          host port of the shop (default 8088, bound to 127.0.0.1 only)
#   LD_TESTNET_ACCOUNT   your testnet receiving address; without it a fresh faucet account is used,
#                        XRP only. With it, RLUSD and USDC are offered too (it needs the trust lines).
#   LD_TRY_IMAGE         the shop image (default: the published one; `--build` builds this checkout)
#
# The services are named as the end-to-end harness expects (phpfpm). Nothing but the shop is
# published to the host; the database and the search engine stay inside this stack.
name: ledger-direct-try-magento

services:
  phpfpm:
    image: ${LD_TRY_IMAGE:-ghcr.io/ledger-direct/try-magento:latest}
    build:
      context: ../..
      dockerfile: dev/try/Dockerfile
    environment:
      LD_BASE_URL: http://localhost:${LD_TRY_PORT:-8088}/
      LD_TESTNET_ACCOUNT: ${LD_TESTNET_ACCOUNT:-}
      LD_STABLECOINS: ${LD_STABLECOINS:-1}
    ports:
      - "127.0.0.1:${LD_TRY_PORT:-8088}:8080"
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  db:
    image: mariadb:11.4.13
    environment:
      MARIADB_ROOT_PASSWORD: magento
      MARIADB_DATABASE: magento
      MARIADB_USER: magento
      MARIADB_PASSWORD: magento
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  # OpenSearch with the analysis-icu and analysis-phonetic plugins Magento's search needs.
  opensearch:
    image: markoshust/magento-opensearch:2.12-0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      # A try-it stack runs on laptops whose Docker disk is often nearly full; OpenSearch would then
      # refuse to create Magento's search index, and the catalogue pages would stay empty.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health"]
      interval: 5s
      retries: 60
